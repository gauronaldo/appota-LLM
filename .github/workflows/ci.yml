name: Python checks

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, integration and regression tests
        run: python src test
      - name: Verify development baseline
        run: python src evaluate --split dev --verify-only
      - name: Verify holdout baseline
        run: python src evaluate --split holdout --verify-only
      - name: Verify source package
        run: python src package --verify
